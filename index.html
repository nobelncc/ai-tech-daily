<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI &amp; Tech Daily — Latest Summaries</title>
<meta name="description" content="Automatically updated summaries of the latest AI and technology news.">
<style>
  :root{
    --ink:#1a1a1a;
    --paper:#f7f5f0;
    --rule:#1a1a1a;
    --accent:#b23a2f;
    --muted:#6b6862;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Georgia','Times New Roman',serif;
    line-height:1.5;
  }
  header{
    border-bottom:4px double var(--rule);
    padding:28px 20px 16px;
    text-align:center;
  }
  .masthead{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:12px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:6px;
  }
  h1{
    margin:0;
    font-size:2.6rem;
    letter-spacing:-0.5px;
  }
  .tagline{
    color:var(--muted);
    font-size:.95rem;
    margin-top:8px;
    font-family:'Helvetica Neue',Arial,sans-serif;
  }
  .updated-bar{
    max-width:900px;
    margin:0 auto;
    padding:10px 20px;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:12px;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid #ddd8cc;
  }
  .filters{
    max-width:900px;
    margin:14px auto 0;
    padding:0 20px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    font-family:'Helvetica Neue',Arial,sans-serif;
  }
  .filter-btn{
    border:1px solid var(--ink);
    background:transparent;
    color:var(--ink);
    padding:5px 12px;
    font-size:12px;
    letter-spacing:.05em;
    text-transform:uppercase;
    cursor:pointer;
    border-radius:2px;
  }
  .filter-btn.active{
    background:var(--ink);
    color:var(--paper);
  }
  main{
    max-width:900px;
    margin:0 auto;
    padding:20px;
  }
  .article{
    background:var(--card);
    border:1px solid #e2ddd0;
    padding:20px 22px;
    margin-bottom:16px;
  }
  .article-meta{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:6px;
    display:flex;
    gap:10px;
    align-items:center;
  }
  .article-meta .dot{color:var(--muted);}
  .article-meta .time{color:var(--muted); text-transform:none; letter-spacing:0;}
  .article h2{
    margin:0 0 8px;
    font-size:1.35rem;
    line-height:1.3;
  }
  .article h2 a{
    color:var(--ink);
    text-decoration:none;
  }
  .article h2 a:hover{
    text-decoration:underline;
  }
  .article p{
    margin:0 0 10px;
    color:#3a3833;
    font-size:1rem;
  }
  .read-source{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:12px;
    color:var(--accent);
    text-decoration:none;
    font-weight:600;
  }
  .read-source:hover{text-decoration:underline;}
  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    font-family:'Helvetica Neue',Arial,sans-serif;
  }
  footer{
    text-align:center;
    padding:30px 20px 50px;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:12px;
    color:var(--muted);
  }
  @media (max-width:600px){
    h1{font-size:1.9rem;}
    .article{padding:16px;}
  }
</style>
</head>
<body>

<header>
  <div class="masthead">Updated automatically, around the clock</div>
  <h1 id="site-title">AI &amp; Tech Daily</h1>
  <div class="tagline" id="site-tagline">Automatically updated summaries of the latest AI and technology news.</div>
</header>

<div class="updated-bar">
  <span id="last-updated">Loading latest update time…</span>
  <span id="article-count"></span>
</div>

<div class="filters" id="filters"></div>

<main id="main-content">
  <div class="empty-state">Loading latest stories…</div>
</main>

<footer>
  Summaries are AI-generated in the site's own words. Click through to each source for the full original article.
</footer>

<script>
async function loadArticles() {
  const main = document.getElementById('main-content');
  try {
    const res = await fetch('data/articles.json', { cache: 'no-store' });
    const data = await res.json();

    document.getElementById('site-title').textContent = data.site_name || 'News Aggregator';
    document.getElementById('site-tagline').textContent = data.site_description || '';
    document.title = (data.site_name || 'News Aggregator') + ' — Latest Summaries';

    const updatedEl = document.getElementById('last-updated');
    if (data.last_updated) {
      const d = new Date(data.last_updated);
      updatedEl.textContent = 'Last updated: ' + d.toLocaleString();
    } else {
      updatedEl.textContent = 'Not updated yet — waiting for first automated run.';
    }

    const articles = data.articles || [];
    document.getElementById('article-count').textContent = articles.length + ' stories';

    if (articles.length === 0) {
      main.innerHTML = '<div class="empty-state">No stories yet. Once the automated pipeline runs for the first time, new stories will appear here — no action needed.</div>';
      return;
    }

    // Build category filter buttons
    const categories = ['All', ...new Set(articles.map(a => a.category).filter(Boolean))];
    const filtersEl = document.getElementById('filters');
    filtersEl.innerHTML = categories.map((c, i) =>
      `<button class="filter-btn ${i === 0 ? 'active' : ''}" data-cat="${c}">${c}</button>`
    ).join('');

    function render(filterCat) {
      const filtered = filterCat === 'All' ? articles : articles.filter(a => a.category === filterCat);
      if (filtered.length === 0) {
        main.innerHTML = '<div class="empty-state">No stories in this category yet.</div>';
        return;
      }
      main.innerHTML = filtered.map(a => {
        const time = a.fetched_at ? new Date(a.fetched_at).toLocaleString() : '';
        return `
          <article class="article">
            <div class="article-meta">
              <span>${escapeHtml(a.source || '')}</span>
              <span class="dot">•</span>
              <span>${escapeHtml(a.category || '')}</span>
              <span class="dot">•</span>
              <span class="time">${time}</span>
            </div>
            <h2><a href="${a.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(a.title)}</a></h2>
            <p>${escapeHtml(a.summary || '')}</p>
            <a class="read-source" href="${a.url}" target="_blank" rel="noopener noreferrer">Read full article at ${escapeHtml(a.source || 'source')} →</a>
          </article>
        `;
      }).join('');
    }

    filtersEl.addEventListener('click', (e) => {
      if (!e.target.classList.contains('filter-btn')) return;
      filtersEl.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      render(e.target.dataset.cat);
    });

    render('All');

  } catch (err) {
    main.innerHTML = '<div class="empty-state">Could not load stories right now. Please refresh the page.</div>';
    console.error(err);
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

loadArticles();
</script>

</body>
</html>
